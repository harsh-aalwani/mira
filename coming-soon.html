<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — MIRA</title>
  <meta name="description" content="MIRA is coming soon. Preparing the next step for private, multimodal knowledge retrieval.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/claymorphism.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/snake.css">
  
  <style>
    .coming-soon-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .cs-card {
      max-width: 720px;
      width: 100%;
      padding: 56px 40px;
      position: relative;
      z-index: 10;
    }

    .cs-visual-stage {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 36px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cs-core-orb {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #E0E7FF 40%, #6366F1 80%, #4338CA 100%);
      box-shadow: 
        0 20px 50px rgba(99, 102, 241, 0.4),
        -10px -10px 24px rgba(255, 255, 255, 0.95),
        inset 3px 3px 6px rgba(255, 255, 255, 0.9),
        inset -5px -6px 14px rgba(30, 27, 95, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      animation: pulseGlow 3.5s ease-in-out infinite;
    }

    .cs-satellite {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #FFFFFF;
      box-shadow: var(--clay-pill-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .cs-sat-1 { top: 0; left: 50%; transform: translateX(-50%); animation: floatGentle 5s ease-in-out infinite; }
    .cs-sat-2 { top: 22%; right: 4%; animation: floatGentleRev 6s ease-in-out infinite; }
    .cs-sat-3 { bottom: 22%; right: 4%; animation: floatGentle 5.5s ease-in-out infinite; }
    .cs-sat-4 { bottom: 0; left: 50%; transform: translateX(-50%); animation: floatGentleRev 6.2s ease-in-out infinite; }
    .cs-sat-5 { bottom: 22%; left: 4%; animation: floatGentle 5.8s ease-in-out infinite; }
    .cs-sat-6 { top: 22%; left: 4%; animation: floatGentleRev 5.2s ease-in-out infinite; }

    .cs-badges-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .pulse-ring-loader {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px dashed rgba(99, 102, 241, 0.4);
      animation: rotateRings 14s linear infinite;
    }

    @keyframes rotateRings {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="coming-soon-wrapper">
    <div class="cs-card clay-card">
      <!-- 3D Centerpiece Stage -->
      <div class="cs-visual-stage">
        <div class="pulse-ring-loader"></div>
        <div class="cs-core-orb" id="cs-core-orb" role="button" tabindex="0">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>

        <!-- Floating 6 Format Satellites -->
        <div class="cs-satellite cs-sat-1" title="PDF Document">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        </div>
        <div class="cs-satellite cs-sat-2" title="Word DOCX">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0284C7" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <div class="cs-satellite cs-sat-3" title="Visual Image">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0891B2" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </div>
        <div class="cs-satellite cs-sat-4" title="Audio Recording">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </div>
        <div class="cs-satellite cs-sat-5" title="Video Media">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </div>
        <div class="cs-satellite cs-sat-6" title="Text Note">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
        </div>
      </div>

      <!-- Three Pill Badges -->
      <div class="cs-badges-row">
        <span class="clay-pill clay-pill-primary">Multimodal</span>
        <span class="clay-pill clay-pill-primary">Local-first</span>
        <span class="clay-pill clay-pill-primary">Grounded</span>
      </div>

      <h1 class="hero-title" style="font-size: 2.8rem; margin-bottom: 16px;">
        MIRA is coming soon.
      </h1>
      
      <p class="section-subtitle" style="max-width: 540px; margin-bottom: 32px;">
        We’re preparing the next step for private, multimodal knowledge retrieval.
      </p>

      <!-- Primary Action -->
      <div style="margin-top: 44px;">
        <a href="index.html" class="clay-btn clay-btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Back to MIRA
        </a>
      </div>
    </div>
  </div>

  <script src="js/snake.js"></script>
  <script src="js/cursor.js"></script>
</body>
</html>
