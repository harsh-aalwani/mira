<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Soft Clay Gradients -->
    <linearGradient id="clay-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="clay-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="clay-grad-lavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="clay-grad-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- PDF Icon (Soft 3D Clay Document) -->
    <symbol id="icon-pdf" viewBox="0 0 64 64">
      <rect x="8" y="6" width="48" height="52" rx="12" fill="url(#clay-grad-surface)" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M40 6 L56 22 L40 22 Z" fill="#E2E8F0" rx="4" />
      <rect x="16" y="24" width="32" height="6" rx="3" fill="#6366F1" opacity="0.85" />
      <rect x="16" y="34" width="24" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="42" width="28" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="50" width="16" height="4" rx="2" fill="#94A3B8" />
    </symbol>

    <!-- DOCX Icon (Word Document) -->
    <symbol id="icon-docx" viewBox="0 0 64 64">
      <rect x="8" y="6" width="48" height="52" rx="12" fill="url(#clay-grad-surface)" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="16" width="18" height="18" rx="6" fill="url(#clay-grad-cyan)" />
      <text x="25" y="29" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">W</text>
      <rect x="38" y="18" width="12" height="4" rx="2" fill="#94A3B8" />
      <rect x="38" y="26" width="10" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="40" width="32" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="48" width="22" height="4" rx="2" fill="#94A3B8" />
    </symbol>

    <!-- Image Icon (Photo & Landscape) -->
    <symbol id="icon-img" viewBox="0 0 64 64">
      <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#clay-grad-surface)" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="24" cy="24" r="6" fill="url(#clay-grad-cyan)" />
      <path d="M12 48 L26 34 L36 44 L44 36 L52 48 Z" fill="url(#clay-grad-primary)" opacity="0.9" />
    </symbol>

    <!-- Audio Icon (Waveform & Sound) -->
    <symbol id="icon-audio" viewBox="0 0 64 64">
      <rect x="8" y="8" width="48" height="48" rx="14" fill="url(#clay-grad-surface)" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="28" width="5" height="12" rx="2.5" fill="url(#clay-grad-lavender)" />
      <rect x="24" y="20" width="5" height="26" rx="2.5" fill="url(#clay-grad-primary)" />
      <rect x="32" y="14" width="5" height="38" rx="2.5" fill="url(#clay-grad-cyan)" />
      <rect x="40" y="24" width="5" height="20" rx="2.5" fill="url(#clay-grad-lavender)" />
      <rect x="48" y="30" width="5" height="8" rx="2.5" fill="#94A3B8" />
    </symbol>

    <!-- Video Icon (Media Screen & Play) -->
    <symbol id="icon-video" viewBox="0 0 64 64">
      <rect x="6" y="10" width="52" height="44" rx="14" fill="url(#clay-grad-surface)" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="12" y="16" width="40" height="32" rx="10" fill="url(#clay-grad-primary)" opacity="0.1" />
      <polygon points="26,24 42,32 26,40" fill="url(#clay-grad-primary)" />
    </symbol>

    <!-- Text Icon (Notes & Markdown) -->
    <symbol id="icon-txt" viewBox="0 0 64 64">
      <rect x="8" y="6" width="48" height="52" rx="12" fill="url(#clay-grad-surface)" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="16" y="16" width="20" height="6" rx="3" fill="#64748B" />
      <rect x="16" y="26" width="32" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="34" width="28" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="42" width="30" height="4" rx="2" fill="#94A3B8" />
      <rect x="16" y="50" width="18" height="4" rx="2" fill="#94A3B8" />
    </symbol>

    <!-- MIRA Core Logo Badge -->
    <symbol id="mira-core" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20" fill="url(#clay-grad-primary)" />
      <circle cx="24" cy="24" r="10" fill="#FFFFFF" opacity="0.95" />
      <circle cx="24" cy="24" r="4" fill="#4338CA" />
      <circle cx="34" cy="16" r="3" fill="#38BDF8" />
      <circle cx="14" cy="32" r="3" fill="#A78BFA" />
    </symbol>
  </defs>
</svg>
